[www]

user = php

; До 8.4.27 это значение перекрывал zz-docker.conf официального образа (listen = 9000).
; Теперь он listen не задаёт, поэтому слушаем все интерфейсы явно — nginx ходит в fpm из другого контейнера.
listen = 9000

pm = dynamic

pm.max_children = 50
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 4

clear_env = no