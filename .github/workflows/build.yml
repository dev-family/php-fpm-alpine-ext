# Сборка на каждый пуш и PR; публикация в ghcr только по тегу (тег = версия PHP внутри, например 8.4.27).
name: build

on:
  push:
    branches: ['**']
    tags: ['*']
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          docker build --pull \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t "$IMAGE:ci" .

      - name: Smoke test
        run: |
          docker run --rm --entrypoint php "$IMAGE:ci" -v
          docker run --rm --entrypoint php "$IMAGE:ci" -m
          docker run --rm --entrypoint php-fpm "$IMAGE:ci" -tt 2>&1 | grep -E 'listen = 9000$'

      - name: Push
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag "$IMAGE:ci" "$IMAGE:${{ github.ref_name }}"
          docker push "$IMAGE:${{ github.ref_name }}"
